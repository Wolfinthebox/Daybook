<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daybook">
<meta name="theme-color" content="#0e0f13">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Daybook</title>
<style>
:root{--acc:#7c9cff;--bg:#0e0f13;--card:#171920;--card2:#1f222b;--line:#2a2e3a;--text:#e9ecf2;--muted:#8b93a7;--good:#4ade80;--bad:#f87171;--warn:#fbbf24}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(80px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:rgba(14,15,19,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
header h1{font-size:20px;margin:0;font-weight:700}
header .sub{color:var(--muted);font-size:12px}
.icon-btn{background:var(--card);border:1px solid var(--line);color:var(--text);width:40px;height:40px;border-radius:12px;font-size:17px;display:flex;align-items:center;justify-content:center}
.icon-btn svg{width:20px;height:20px}
main{padding:14px 16px 90px;max-width:640px;margin:0 auto}
nav#tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:rgba(18,19,24,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav#tabs button{flex:1;background:none;border:0;color:var(--muted);font-size:11px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit}
nav#tabs button svg{width:22px;height:22px}
nav#tabs button.on{color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card.sub{background:var(--card2)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.grid .card{margin:0}
.k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.big{font-size:24px;font-weight:700;margin-top:2px}
.muted{color:var(--muted)}
small{color:var(--muted);font-size:12px;display:block;margin-top:4px}
h2{font-size:17px;margin:18px 0 10px}
h3{font-size:16px;margin:4px 0 10px}
.bar{height:8px;background:var(--line);border-radius:6px;position:relative}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:6px;max-width:100%}
.bar>b{position:absolute;top:-3px;width:2px;height:14px;background:var(--text)}
button{font-family:inherit;cursor:pointer}
button.primary{background:var(--acc);color:#0b0c10;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;width:100%}
button.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px}
button.ghost.sm{padding:6px 10px;font-size:13px}
button.danger{color:var(--bad)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.fld{display:block;margin-bottom:10px}
.fld>span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px;font-family:inherit;min-height:42px}
textarea{min-height:0}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--acc);flex:none}
input[type=color]{height:44px;padding:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
.chip{background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:7px 12px;font-size:14px}
.chip.on{background:var(--acc);color:#0b0c10;border-color:var(--acc);font-weight:600}
.list .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border:0}
.x{background:none;border:0;color:var(--muted);font-size:15px;padding:4px 6px}
.topic-row,.blk-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.topic-row input:not([type=checkbox]){flex:1;padding:8px;min-width:0}
.topic-row .hrs{flex:0 0 58px}
.blk-row input[type=time]{flex:0 0 92px;padding:8px}
.blk-row input:not([type=time]){flex:1;padding:8px;min-width:0}
.tl .slot{display:flex;gap:10px;padding:9px 10px;border-radius:12px;margin-bottom:6px;align-items:center}
.tl .slot .t{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);width:88px;flex:none}
.slot.class{background:var(--card2)}
.slot.study{background:color-mix(in srgb,var(--acc) 16%,var(--card));border:1px solid color-mix(in srgb,var(--acc) 40%,transparent)}
.slot.gym{background:rgba(74,222,128,.12)}
.slot.buffer{border:1px dashed var(--line);color:var(--muted);padding:6px 10px}
.slot.buffer div[style*="font-weight"]{font-weight:500!important}
.slot.past{opacity:.4}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:7;background:var(--acc);color:#0b0c10;border:0;border-radius:18px;padding:14px 18px;font-weight:800;font-size:16px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.banner{border-radius:14px;padding:12px 14px;margin-bottom:12px;background:rgba(251,191,36,.10);border:1px solid rgba(251,191,36,.35);font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.banner.bad{background:rgba(248,113,113,.10);border-color:rgba(248,113,113,.35)}
.good{color:var(--good)}.badc{color:var(--bad)}.warnc{color:var(--warn)}
#sheetWrap{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
#sheet{background:var(--card);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.dots i{aspect-ratio:1;border-radius:6px;background:var(--line)}
.dots i.c{background:var(--good)}.dots i.j{background:var(--bad)}
.thumb{width:54px;height:54px;border-radius:10px;object-fit:cover;background:var(--line);flex:none}
.amount{font-size:34px;font-weight:700;text-align:center;padding:14px}
.hello{font-size:22px;font-weight:700;margin:2px 0 12px}
.ob-prog{display:flex;gap:4px;margin-bottom:16px}
.ob-prog i{flex:1;height:4px;border-radius:3px;background:var(--line)}
.ob-prog i.on{background:var(--acc)}
svg.chart{width:100%;height:160px;display:block}
details summary{cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:30;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:90vw}
.hidden{display:none!important}
</style>
</head>
<body>
<header id="top"></header>
<main id="main"></main>
<button id="fab" class="fab hidden" onclick="sheetExpense()">+ Spend</button>
<nav id="tabs"></nav>
<div id="sheetWrap" class="hidden"><div id="sheet"></div></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const KEY='daybook_v1';
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const pad=n=>String(n).padStart(2,'0');
const ds=d=>{d=d instanceof Date?d:new Date(d);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>ds(new Date());
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const daysBetween=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const toMin=t=>{if(!t)return null;const[h,m]=t.split(':').map(Number);return h*60+m};
const toHM=m=>pad(Math.floor(m/60)%24)+':'+pad(Math.round(m%60));
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtH=min=>{min=Math.max(0,Math.round(min));const h=Math.floor(min/60),m=min%60;return h?(h+'h'+(m?' '+m+'m':'')):m+'m'};
const money=n=>(n<0?'-':'')+S.settings.currency+Math.abs(Math.round(n)).toLocaleString('en-IN');
const monthKey=s=>s.slice(0,7);
const nice=s=>pd(s).toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
const getP=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
function setP(o,p,v){const ks=p.split('.');const last=ks.pop();const t=ks.reduce((a,k)=>a[k]??(a[k]={}),o);t[last]=v}
function toast(msg){const d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2800)}

/* ---------- state ---------- */
function defaults(){
  const t=today();const tp=(name,hours)=>({id:uid(),name,hours,done:false});
  return {v:1,onboarded:false,created:t,lastBackup:null,timer:null,
    settings:{name:'',currency:'₹',accent:'#7c9cff',
      categories:['Food','Transport','Rent & bills','Study','Health & gym','Shopping','Fun','Other'],
      junkList:['chips','cold drink','coke','pepsi','pizza','burger','fries','chocolate','ice cream','maggi','samosa','pastry','cake','namkeen','momos','kurkure'],
      splits:['Push','Pull','Legs','Upper','Lower','Full body','Cardio','Abs'],
      units:['g','ml','pcs','plate','bowl','cup','glass','slice','tbsp'],
      weight:{start:null,target:null,targetDate:'',why:''},
      sleep:{bed:'23:30',wake:'06:30',why:''},
      gym:{perWeek:6,start:'',end:'',days:[1,2,3,4,5,6],why:''},
      study:{dailyTarget:3,start:'06:30',end:'23:00',minBlock:30,maxBlock:90,breakMin:10,collegeBefore:45,collegeAfter:45,gymBefore:10,gymAfter:45,windDown:30,why:''},
      routine:[{id:uid(),label:'Lunch',start:'13:00',end:'13:45',days:[0,1,2,3,4,5,6]},{id:uid(),label:'Dinner',start:'20:30',end:'21:00',days:[0,1,2,3,4,5,6]}],
      budget:{monthly:0,why:''},
      junk:{why:''},
      timetable:{0:[],1:[],2:[],3:[],4:[],5:[],6:[]}},
    goals:[
      {id:uid(),name:'CFA Level 1',deadline:'2026-12-31',active:true,why:'',start:t,topics:[
        tp('Quantitative Methods',20),tp('Economics',18),tp('Financial Statement Analysis',35),tp('Corporate Issuers',15),tp('Equity Investments',25),
        tp('Fixed Income',30),tp('Derivatives',15),tp('Alternative Investments',15),tp('Portfolio Management',20),tp('Ethics & Professional Standards',25)]},
      {id:uid(),name:'Financial Modelling',deadline:'2026-12-31',active:true,why:'',start:t,topics:[tp('Course modules',30)]}],
    budgets:{},expenses:[],gym:[],sessions:[],overrides:{},food:[],weights:[],sleepLog:[],mocks:[]};
}
function merge(d,s){if(s===null||typeof s!=='object'||Array.isArray(s))return s;const o={...d};for(const k in s)o[k]=(d&&d[k]&&typeof d[k]==='object'&&!Array.isArray(d[k]))?merge(d[k],s[k]):s[k];return o}
function load(){try{const r=localStorage.getItem(KEY);return r?merge(defaults(),JSON.parse(r)):defaults()}catch(e){return defaults()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Storage full — back up and delete old entries.')}}
let S=load();

/* ---------- photo storage (IndexedDB) ---------- */
let dbp;
function db(){return dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open('daybook_photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
async function putPhoto(id,v){const d=await db();return new Promise((res,rej)=>{const t=d.transaction('p','readwrite');t.objectStore('p').put(v,id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function getPhoto(id){const d=await db();return new Promise(res=>{const r=d.transaction('p').objectStore('p').get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)})}
async function delPhoto(id){const d=await db();return new Promise(res=>{const t=d.transaction('p','readwrite');t.objectStore('p').delete(id);t.oncomplete=res;t.onerror=res})}
async function allPhotos(){const d=await db();return new Promise(res=>{const out={};const r=d.transaction('p').objectStore('p').openCursor();r.onsuccess=()=>{const c=r.result;if(c){out[c.key]=c.value;c.continue()}else res(out)};r.onerror=()=>res(out)})}
function compress(file){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const max=900;let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.72))};img.onerror=rej;img.src=u})}

/* ---------- form helpers ---------- */
const fld=(label,path,type='text',extra='')=>`<label class="fld"><span>${label}</span><input type="${type}" data-bind="${path}" value="${esc(getP(S,path)??'')}" ${type==='number'?'inputmode="decimal"':''} ${extra}></label>`;
const area=(label,path,ph='Your reason — you will see this when you slip')=>`<label class="fld"><span>${label}</span><textarea data-bind="${path}" rows="2" placeholder="${esc(ph)}">${esc(getP(S,path)??'')}</textarea></label>`;
const listArea=(label,path)=>`<label class="fld"><span>${label}</span><textarea data-bind="${path}" data-list rows="3">${esc((getP(S,path)||[]).join(', '))}</textarea><small>Separate with commas</small></label>`;
const inp=(id,label,type='text',val='',ph='')=>`<label class="fld"><span>${label}</span><input id="${id}" type="${type}" value="${esc(val)}" placeholder="${esc(ph)}" ${type==='number'?'inputmode="decimal"':''}></label>`;
function onBind(e){const el=e.target;const p=el.dataset&&el.dataset.bind;if(!p)return;let v;
  if(el.type==='checkbox')v=el.checked;else if(el.type==='number')v=el.value===''?null:parseFloat(el.value);else v=el.value;
  if(el.dataset.list!==undefined)v=el.value.split(/[\n,]/).map(x=>x.trim()).filter(Boolean);
  setP(S,p,v);save();if(p==='settings.accent')applyAccent();capC={}}
document.addEventListener('input',onBind);document.addEventListener('change',onBind);

/* ---------- settings sections (also used by setup) ---------- */
const SEC={
  profile:()=>`<h3>About you</h3>${fld('Your name','settings.name')}${fld('Currency symbol','settings.currency')}`,
  body:()=>`<h3>Weight target</h3><div class="row2">${fld('Current weight (kg)','settings.weight.start','number','step="0.1"')}${fld('Target weight (kg)','settings.weight.target','number','step="0.1"')}</div>${fld('Reach it by','settings.weight.targetDate','date')}${area('Why this target?','settings.weight.why')}`,
  sleep:()=>`<h3>Sleep target</h3><div class="row2">${fld('Bedtime','settings.sleep.bed','time')}${fld('Wake time','settings.sleep.wake','time')}</div>${area('Why?','settings.sleep.why')}`,
  gym:()=>`<h3>Gym target</h3>${fld('Gym days per week','settings.gym.perWeek','number')}<div class="row2">${fld('Usual gym start','settings.gym.start','time')}${fld('Usual gym end','settings.gym.end','time')}</div><small style="margin:-4px 0 10px">The study planner keeps this slot (plus travel and freshen-up time) free. Leave blank if it varies.</small><div class="k" style="margin-bottom:6px">Gym slot applies on</div><div class="chips">${[1,2,3,4,5,6,0].map(d=>`<button class="chip ${(S.settings.gym.days||[]).includes(d)?'on':''}" onclick="togGymDay(${d})">${DAYS[d]}</button>`).join('')}</div>${listArea('Workout types','settings.splits')}${area('Why?','settings.gym.why')}`,
  study:()=>`<h3>Study planner rules</h3>${fld('Minimum study per day (hours)','settings.study.dailyTarget','number','step="0.5"')}<div class="row2">${fld('Earliest study time','settings.study.start','time')}${fld('Latest study time','settings.study.end','time')}</div><div class="row2">${fld('Shortest block (min)','settings.study.minBlock','number')}${fld('Longest block (min)','settings.study.maxBlock','number')}</div>${fld('Break after classes / between blocks (min)','settings.study.breakMin','number')}<small style="margin:-4px 0 10px">Remaining hours are spread over the days left in proportion to each day's free time, so free weekends automatically get more.</small>${area('Why these hours?','settings.study.why')}`,
  routine:()=>`<h3>Daily routine & buffers</h3><small style="margin:-4px 0 12px">Time the planner will never use for study.</small><div class="row2">${fld('Before first class: get ready + breakfast + commute (min)','settings.study.collegeBefore','number')}${fld('After last class: commute back (min)','settings.study.collegeAfter','number')}</div><div class="row2">${fld('Before gym: travel (min)','settings.study.gymBefore','number')}${fld('After gym: freshen up (min)','settings.study.gymAfter','number')}</div>${fld('Stop studying this long before bedtime (min)','settings.study.windDown','number')}<div class="k" style="margin:8px 0">Fixed routine blocks — meals, chores, calls home</div>${(S.settings.routine||[]).map((r,i)=>`<div class="card sub"><div class="blk-row"><input type="time" data-bind="settings.routine.${i}.start" value="${r.start||''}"><input type="time" data-bind="settings.routine.${i}.end" value="${r.end||''}"><input data-bind="settings.routine.${i}.label" value="${esc(r.label)}" placeholder="e.g. Lunch"><button class="x" onclick="delRoutine(${i})">✕</button></div><div class="chips" style="margin:8px 0 0">${[1,2,3,4,5,6,0].map(d=>`<button class="chip ${(r.days||[]).includes(d)?'on':''}" style="padding:5px 9px;font-size:13px" onclick="togRDay(${i},${d})">${DAYS[d]}</button>`).join('')}</div></div>`).join('')}<button class="ghost sm" onclick="addRoutine()">+ Routine block</button>`,
  goals:()=>goalsEditor(),
  timetable:()=>ttEditor(),
  money:()=>`<h3>Money</h3>${fld('Default monthly budget','settings.budget.monthly','number')}${listArea('Spending categories','settings.categories')}${area('Why this budget?','settings.budget.why')}`,
  junk:()=>`<h3>No-junk rule</h3>${listArea('Junk list — logging anything containing these words breaks the streak','settings.junkList')}${fld('Count streak from','created','date')}${listArea('Food units','settings.units')}${area('Why?','settings.junk.why')}`
};
function goalsEditor(){return `<h3>Study goals</h3><small style="margin:-4px 0 10px">Topics are studied top to bottom. Hours are estimates — edit them. Tick topics you've already finished.</small>`+S.goals.map((g,gi)=>`<div class="card sub"><div class="row2">${fld('Goal','goals.'+gi+'.name')}${fld('Finish content by','goals.'+gi+'.deadline','date')}</div><label class="chk"><input type="checkbox" data-bind="goals.${gi}.active" ${g.active?'checked':''}> Include in planner</label>${area('Why this goal?','goals.'+gi+'.why')}${g.topics.map((t,ti)=>`<div class="topic-row"><input type="checkbox" data-bind="goals.${gi}.topics.${ti}.done" ${t.done?'checked':''}><input data-bind="goals.${gi}.topics.${ti}.name" value="${esc(t.name)}"><input type="number" inputmode="decimal" class="hrs" data-bind="goals.${gi}.topics.${ti}.hours" value="${t.hours??''}"><span class="muted">h</span><button class="x" onclick="moveTopic(${gi},${ti})">↑</button><button class="x" onclick="delTopic(${gi},${ti})">✕</button></div>`).join('')}<small>Total ${g.topics.reduce((a,t)=>a+(+t.hours||0),0)} h</small><div class="btns"><button class="ghost sm" onclick="addTopic(${gi})">+ Topic</button><button class="ghost sm danger" onclick="delGoal(${gi})">Delete goal</button></div></div>`).join('')+`<button class="ghost" onclick="addGoal()">+ Add goal</button>`}
function ttEditor(){return `<h3>Weekly college timetable</h3><small style="margin:-4px 0 10px">Fixed lectures each week. You can change any single day later from the Study tab.</small>`+[1,2,3,4,5,6,0].map(d=>`<div class="card sub"><b>${DAYS[d]}</b><div style="margin-top:8px">${blocksEditor('settings.timetable.'+d)}</div></div>`).join('')}
function blocksEditor(path){const arr=getP(S,path)||[];return arr.map((b,i)=>`<div class="blk-row"><input type="time" data-bind="${path}.${i}.start" value="${b.start||''}"><input type="time" data-bind="${path}.${i}.end" value="${b.end||''}"><input data-bind="${path}.${i}.label" value="${esc(b.label)}" placeholder="Subject"><button class="x" onclick="delBlock('${path}',${i})">✕</button></div>`).join('')+`<button class="ghost sm" onclick="addBlock('${path}')">+ Class</button>`}
function afterBlockEdit(path){save();capC={};if(path.startsWith('overrides.'))dayEditor(path.slice(10));else rerender()}

/* ---------- study planning ---------- */
let capC={};
function classesFor(d){return S.overrides[d]??S.settings.timetable[pd(d).getDay()]??[]}
function windowFor(){const st=S.settings.study;const s=toMin(st.start)??390;let e=toMin(st.end)??1380;let bed=toMin(S.settings.sleep.bed);
  if(bed!=null){if(bed<720)bed+=1440;e=Math.min(e,bed-(+st.windDown||0))}return[s,e]}
/* Everything that is NOT study time: classes (+ commute/get-ready buffers), gym (+ travel/freshen-up), routine blocks */
function busyFor(d){const st=S.settings.study,dow=pd(d).getDay(),out=[];
  const cls=classesFor(d).filter(b=>b.start&&b.end).map(b=>({s:toMin(b.start),e:toMin(b.end),type:'class',label:b.label||'Class'})).sort((a,b)=>a.s-b.s);
  out.push(...cls);
  if(cls.length){const cb=+st.collegeBefore||0,ca=+st.collegeAfter||0,f=cls[0],l=cls[cls.length-1];
    if(cb)out.push({s:f.s-cb,e:f.s,type:'buffer',label:'Get ready & commute'});
    if(ca)out.push({s:l.e,e:l.e+ca,type:'buffer',label:'Commute back'})}
  const g=S.settings.gym;if(g.start&&g.end&&(g.days||[]).includes(dow)){const gs=toMin(g.start),ge=toMin(g.end),b=+st.gymBefore||0,a=+st.gymAfter||0;
    if(b)out.push({s:gs-b,e:gs,type:'buffer',label:'Leave for gym'});out.push({s:gs,e:ge,type:'gym',label:'Gym'});if(a)out.push({s:ge,e:ge+a,type:'buffer',label:'Freshen up'})}
  for(const r of S.settings.routine||[])if(r.start&&r.end&&(r.days||[]).includes(dow))out.push({s:toMin(r.start),e:toMin(r.end),type:'buffer',label:r.label||'Routine'});
  return out.sort((a,b)=>a.s-b.s||a.e-b.e)}
function gaps(d){const st=S.settings.study,br=+st.breakMin||0,minB=+st.minBlock||30;const[s,e]=windowFor();
  const busy=busyFor(d).map(b=>b.type==='class'?[b.s-br,b.e+br]:[b.s,b.e]).sort((a,b)=>a[0]-b[0]);
  const out=[];let cur=s;for(const[a,b]of busy){if(a>cur)out.push([cur,Math.min(a,e)]);cur=Math.max(cur,b)}
  if(e>cur)out.push([cur,e]);return out.filter(([a,b])=>b-a>=minB)}
function cap(d){if(capC[d]==null)capC[d]=gaps(d).reduce((a,[x,y])=>a+y-x,0);return capC[d]}
const topicLogged=t=>S.sessions.filter(s=>s.tid===t.id).reduce((a,s)=>a+s.min,0);
function gStats(g,excl){const total=g.topics.reduce((a,t)=>a+(+t.hours||0),0)*60;let rem=0;
  for(const t of g.topics){if(t.done)continue;let l=topicLogged(t);if(excl)l-=S.sessions.filter(s=>s.tid===t.id&&s.date===excl).reduce((a,s)=>a+s.min,0);rem+=Math.max(0,(+t.hours||0)*60-l)}
  const pct=total?100*(1-rem/total):0;const st=g.start||S.created;let exp=0;const t=today();
  if(g.deadline&&g.deadline>=st){let tot=0,el=0;for(let d=st;d<=g.deadline;d=addDays(d,1)){const c=cap(d);tot+=c;if(d<t)el+=c}exp=tot?100*el/tot:0;if(t>g.deadline)exp=100}
  return {total,rem,pct,exp,next:g.topics.find(t=>!t.done)}}
function needsFor(d){const t=today();const out=[];
  for(const g of S.goals){if(!g.active)continue;const s=gStats(g,d===t?d:null);if(s.rem<=0)continue;let need;
    if(!g.deadline||g.deadline<d)need=s.rem;else{const from=d>t?t:d;let tot=0;for(let x=from;x<=g.deadline;x=addDays(x,1))tot+=cap(x);need=tot?s.rem*cap(d)/tot:0}
    out.push({g,need,next:s.next})}
  const sum=out.reduce((a,x)=>a+x.need,0);const floor=Math.min((+S.settings.study.dailyTarget||0)*60,cap(d));
  if(sum>0&&sum<floor)out.forEach(x=>x.need*=floor/sum);return out}
function planDay(d){const st=S.settings.study,br=+st.breakMin||0,minB=+st.minBlock||30,maxB=+st.maxBlock||90;
  // show non-study blocks without overlaps (buffers get clipped to the free space around fixed blocks)
  const busy=busyFor(d),items=[];let lastE=-1e9;
  busy.forEach((b,i)=>{if(b.type!=='buffer'){items.push({...b});lastE=Math.max(lastE,b.e);return}
    const nxt=busy.slice(i+1).find(x=>x.type!=='buffer'&&x.s>=b.s);const s=Math.max(b.s,lastE),e=nxt?Math.min(b.e,nxt.s):b.e;
    if(e-s>=5){items.push({...b,s,e});lastE=Math.max(lastE,e)}});
  const needs=needsFor(d).map(x=>({...x,left:x.need}));let alloc=0;
  for(const[a0,b]of gaps(d)){let a=a0;while(b-a>=minB){const c=needs.filter(x=>x.left>=5).sort((x,y)=>y.left-x.left)[0];if(!c)break;
    const len=Math.min(maxB,b-a,Math.max(minB,Math.ceil(c.left/15)*15));
    items.push({s:a,e:a+len,type:'study',label:c.g.name,topic:c.next?.name||'',gid:c.g.id,tid:c.next?.id||''});c.left-=len;alloc+=len;a+=len+br}}
  items.sort((x,y)=>x.s-y.s);const need=needs.reduce((a,x)=>a+x.need,0);return {items,need,alloc,short:Math.max(0,need-alloc)}}

/* ---------- streaks / stats ---------- */
const junkDays=()=>new Set(S.food.filter(f=>f.junk).map(f=>f.date));
function streak(){const jd=junkDays(),lg=new Set(S.food.map(f=>f.date)),t=today();const clean=d=>d===t?!jd.has(d):(lg.has(d)&&!jd.has(d));
  let cur=0;for(let d=t;d>=S.created;d=addDays(d,-1)){if(clean(d))cur++;else break}
  let best=0,run=0;for(let d=S.created;d<=t;d=addDays(d,1)){if(clean(d)){run++;best=Math.max(best,run)}else run=0}
  return {cur,best,junkToday:jd.has(t)}}
const weekStart=t=>addDays(t,-((pd(t).getDay()+6)%7));
const gymWeek=()=>{const ws=weekStart(today());return new Set(S.gym.filter(g=>g.date>=ws).map(g=>g.date)).size};
function monthStats(mk){const ex=S.expenses.filter(e=>monthKey(e.date)===mk);const spent=ex.reduce((a,e)=>a+e.amt,0);const budget=S.budgets[mk]??null;const byCat={};ex.forEach(e=>byCat[e.cat]=(byCat[e.cat]||0)+e.amt);
  const[y,m]=mk.split('-').map(Number);const dim=new Date(y,m,0).getDate();const t=today();let daysLeft=dim;if(monthKey(t)===mk)daysLeft=dim-pd(t).getDate()+1;else if(mk<monthKey(t))daysLeft=0;
  return {ex,spent,budget,byCat,daysLeft,left:budget!=null?budget-spent:null,perDay:budget!=null&&daysLeft?(budget-spent)/daysLeft:null}}

  <div class="card" onclick="go('study')"><div class="k">Study today</div><div class="big ${studied>=p.need&&p.need>0?'good':''}">${fmtH(studied)}</div><small>of ${fmtH(p.need)} needed</small></div>

function vStudy(){const t=today();if(!studyDate)studyDate=new Date().getHours()>=18?addDays(t,1):t;const d=studyDate,p=planDay(d),isT=d===t,now=new Date(),nowM=now.getHours()*60+now.getMinutes();

function chart(w){const xs=w.map(p=>pd(p.date).getTime()),T=S.settings.weight.target;const all=w.map(p=>p.kg).concat(T?[T]:[]);const lo=Math.min(...all)-1,hi=Math.max(...all)+1;const x0=Math.min(...xs),x1=Math.max(...xs);const W=320,H=160,P=26;
  const X=x=>P+(x-x0)/((x1-x0)||1)*(W-2*P),Y=y=>H-P-(y-lo)/(hi-lo)*(H-2*P);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${T?`<line x1="${P}" x2="${W-P}" y1="${Y(T)}" y2="${Y(T)}" stroke="var(--good)" stroke-dasharray="4 4"/><text x="${W-P}" y="${Y(T)-5}" fill="var(--good)" font-size="10" text-anchor="end">target ${T}</text>`:''}<polyline fill="none" stroke="var(--acc)" stroke-width="2.5" points="${w.map((p,i)=>X(xs[i])+','+Y(p.kg)).join(' ')}"/>${w.map((p,i)=>`<circle cx="${X(xs[i])}" cy="${Y(p.kg)}" r="3" fill="var(--acc)"/>`).join('')}<text x="2" y="${P}" fill="var(--muted)" font-size="10">${hi.toFixed(0)}</text><text x="2" y="${H-P}" fill="var(--muted)" font-size="10">${lo.toFixed(0)}</text></svg>`}
function vBody(){const t=today(),w=sortedW(),last=w[w.length-1],W=S.settings.weight;

  const sl=S.sleepLog.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,7);const avg=sl.length?sl.reduce((a,s)=>a+sleepDur(s),0)/sl.length:0;

  <button class="ghost" style="width:100%;margin-bottom:12px" onclick="sheetSleep()">+ Log sleep</button>`;
  if(sl.length)h+=`<div class="card list">${sl.map(s=>`<div class="it"><div><div>${nice(s.date)}</div><small>${s.bed} → ${s.wake}</small></div><span style="display:flex;align-items:center;gap:6px"><b>${fmtH(sleepDur(s))}</b><button class="x" onclick="delItem('sleepLog','${s.id}')">✕</button></span></div>`).join('')}</div>`;
  return h}

async function exportData(withPhotos){const data=JSON.parse(JSON.stringify(S));if(withPhotos)data._photos=await allPhotos();
  const name='daybook-backup-'+today()+'.json';const blob=new Blob([JSON.stringify(data)],{type:'application/json'});const file=new File([blob],name,{type:'application/json'});
  const done=()=>{S.lastBackup=today();save();rerender();toast('Backup created')};
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});return done()}catch(e){if(e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();done()}
$('#importFile').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const d=JSON.parse(await f.text());if(!d.settings)throw 0;if(!confirm('Replace all current data with this backup?'))return;const ph=d._photos;delete d._photos;
    if(ph)for(const[k,v]of Object.entries(ph))await putPhoto(k,v);S=merge(defaults(),d);save();toast('Backup restored');render()}catch(err){alert('That file is not a valid backup.')}});
function resetAll(){if(!confirm('Erase ALL data on this phone?'))return;if(!confirm('Really? This cannot be undone without a backup.'))return;localStorage.removeItem(KEY);indexedDB.deleteDatabase('daybook_photos');location.reload()}

/* ---------- render ---------- */
let view='today',tick=null;
const VIEWS={today:['Today',vToday],money:['Money',vMoney],gym:['Gym',vGym],study:['Study',vStudy],food:['Food',vFood],body:['Body',vBody],settings:['Settings',vSettings]};
function applyAccent(){document.documentElement.style.setProperty('--acc',S.settings.accent||'#7c9cff')}
function render(){applyAccent();capC={};clearInterval(tick);tick=null;
  if(!S.onboarded)return renderOb();
  const[title,fn]=VIEWS[view];
  $('#top').classList.remove('hidden');$('#tabs').classList.remove('hidden');
  $('#top').innerHTML=`<div><h1>${title}</h1><div class="sub">${nice(today())}</div></div><button class="icon-btn" aria-label="Settings" onclick="go('${view==='settings'?'today':'settings'}')">${view==='settings'?'✕':ICON.gear}</button>`;
  $('#main').innerHTML=fn();
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<button class="${view===k?'on':''}" onclick="go('${k}')">${ICON[k]}<span>${l}</span></button>`).join('');
  $('#fab').textContent='+ '+S.settings.currency+' Spend';$('#fab').classList.toggle('hidden',view==='settings');
  if(S.timer&&(view==='today'||view==='study'))tick=setInterval(updTimer,1000);
  if(view==='gym')loadThumbs()}
function go(v){view=v;if(v!=='money')moneyMonth=null;scrollTo(0,0);render()}
function rerender(){const y=scrollY;render();scrollTo(0,y)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&$('#sheetWrap').classList.contains('hidden'))rerender()});
render();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js');
</script>
</body>
